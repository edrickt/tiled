name: Bug report
description: Something tiled wrong, refused to tile, or left the screen disagreeing with the menu.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The most useful evidence is usually the menu
        rows themselves: Tiled narrates refusals, shortcut conflicts, and
        notices there.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.6 / 26.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is Tiled installed?
      options:
        - Release bundle in /Applications
        - Built from source, installed with scripts/install-app.sh
        - swift run (dev build)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, what the screen showed, and what the menu said (status line, notice row, any ⚠ warning or app name).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Tile window A top-left
        2. Focus window B
        3. Press ⌥⇧⌘.
        4. …
    validations:
      required: true
  - type: dropdown
    id: layout
    attributes:
      label: Which layout was active?
      options: [Quarters, Sixths, Not sure]
  - type: input
    id: canvas
    attributes:
      label: Displays and Spaces involved
      placeholder: "one display, one Space / two displays, swiping to a second Space"
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: Accessibility permission is granted (System Settings → Privacy & Security → Accessibility)
          required: true
        - label: No other window manager (Rectangle, Magnet, another Tiled build) is running
          required: true
