name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.0)"
        required: true

# Publishing a release needs write access; the job does nothing else.
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Swift version
        run: swift --version

      # VERSION is the bundle version; a release that disagrees with it
      # would ship an app whose About box lies.
      - name: Tag matches VERSION
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if [ "v$version" != "$tag" ]; then
            echo "tag $tag does not match VERSION $version" >&2
            exit 1
          fi

      - name: Unit tests
        run: swift test

      - name: App bundle
        env:
          UNIVERSAL: "1"
        run: |
          ./scripts/make-app.sh
          codesign --verify --deep --strict build/Tiled.app
          plutil -lint build/Tiled.app/Contents/Info.plist
          lipo -archs build/Tiled.app/Contents/MacOS/Tiled | grep -q arm64
          lipo -archs build/Tiled.app/Contents/MacOS/Tiled | grep -q x86_64
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            build/Tiled.app/Contents/Info.plist

      - name: Package
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          cd build
          ditto -c -k --keepParent Tiled.app "Tiled-$version.zip"
          shasum -a 256 "Tiled-$version.zip" | tee "Tiled-$version.zip.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(tr -d '[:space:]' < VERSION)
          gh release create "$tag" \
            "build/Tiled-$version.zip" "build/Tiled-$version.zip.sha256" \
            --title "Tiled $tag" \
            --generate-notes
